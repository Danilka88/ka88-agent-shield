name: Lint

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          wget -qO /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          sudo mv /tmp/shellcheck-v0.10.0.linux.x86_64/shellcheck /usr/local/bin/

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh