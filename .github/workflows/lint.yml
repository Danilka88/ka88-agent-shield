name: Lint

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          wget -qO- https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.10.0.linux.x86_64/shellcheck /usr/local/bin/

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh